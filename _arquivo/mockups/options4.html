<!doctype html><html><head><meta charset="utf-8">
<title>PromoLiso — 4 referências</title>
<style>
  @font-face{font-family:PLDisplay;src:url('../assets/BarlowCondensed-ExtraBold.ttf') format('truetype');font-weight:800;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#191b1f;font-family:system-ui,Arial,sans-serif;padding:34px 20px 90px;}
  h1{color:#fff;font-size:20px;text-align:center;}
  .sub{color:#8b93a0;text-align:center;font-size:13px;margin:6px 0 34px;}
  .row{display:flex;gap:46px;flex-wrap:wrap;justify-content:center;align-items:flex-start;}
  .col{display:flex;flex-direction:column;align-items:center;max-width:calc(1080px*.36);}
  .tag{color:#fff;font-weight:800;letter-spacing:1px;font-size:16px;margin-bottom:3px;}
  .desc{color:#9aa2ae;font-size:12px;text-align:center;margin-bottom:14px;line-height:1.45;min-height:46px;padding:0 4px;}
  .slot{--s:.36;width:calc(1080px*var(--s));height:calc(1350px*var(--s));overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.6);}
  .frame{transform-origin:top left;transform:scale(var(--s));width:1080px;height:1350px;position:relative;overflow:hidden;display:block;}
  @media(max-width:1360px){.col{max-width:calc(1080px*.30);}.slot{--s:.30;}}
  :root{--dsp:PLDisplay,'Barlow Condensed',Impact,sans-serif;--green:#A6FF2E;--purple:#9A4DFF;}

  /* ===== 1 · PULSE (IGN / The Verge) ===== */
  .p{background:#0E0F13;color:#fff;}
  .p .top{position:absolute;left:64px;right:64px;top:52px;display:flex;align-items:center;justify-content:space-between;}
  .p .wm{font-size:30px;font-weight:800;letter-spacing:.3px;}
  .p .wm b{color:var(--green);}
  .p .live{display:flex;align-items:center;gap:10px;color:#c3c9d1;font-size:19px;font-weight:700;letter-spacing:2px;}
  .p .live i{width:11px;height:11px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 12px #ff4d4d;}
  .p .hero{position:absolute;left:0;right:0;top:118px;height:706px;overflow:hidden;border-top:6px solid var(--green);}
  .p .hero .img{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.02);}
  .p .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,15,19,0) 40%,rgba(14,15,19,.92) 100%);}
  .p .chip{position:absolute;left:64px;top:762px;background:var(--green);color:#08130A;font-family:var(--dsp);font-size:26px;letter-spacing:3px;padding:9px 18px;font-weight:800;}
  .p .body{position:absolute;left:64px;right:64px;top:842px;}
  .p h2{font-family:var(--dsp);font-size:110px;line-height:.9;letter-spacing:-1px;}
  .p .dek{margin-top:24px;font-size:33px;line-height:1.4;color:#aab2bd;font-weight:400;max-width:940px;}
  .p .meta{position:absolute;left:64px;right:64px;bottom:58px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #23262d;padding-top:20px;color:#7d858f;font-size:21px;font-weight:700;letter-spacing:2px;}
  .p .meta b{color:#fff;}

  /* ===== 2 · TITAN (Nvidia / ROG cyber) ===== */
  .t{background:#05060A;color:#fff;}
  .t .grain{position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0);background-size:24px 24px;opacity:.5;}
  .t .glow{position:absolute;inset:0;background:radial-gradient(50% 40% at 78% 0%,rgba(154,77,255,.32),transparent 60%),radial-gradient(60% 40% at 10% 100%,rgba(166,255,46,.14),transparent 60%);}
  .t .slash{position:absolute;left:0;top:0;width:100%;height:8px;background:linear-gradient(90deg,var(--green),var(--purple));box-shadow:0 0 22px rgba(154,77,255,.7);}
  .t .top{position:absolute;left:64px;right:64px;top:50px;display:flex;align-items:center;justify-content:space-between;}
  .t .wm{font-size:30px;font-weight:800;letter-spacing:3px;}
  .t .wm b{color:var(--green);text-shadow:0 0 16px rgba(166,255,46,.7);}
  .t .tab{font-family:var(--dsp);font-size:22px;letter-spacing:5px;color:#cbd2da;border:1px solid #2b303a;padding:8px 16px;}
  .t .hero{position:absolute;left:64px;right:64px;top:130px;height:600px;background:#0a0c12;overflow:hidden;
     clip-path:polygon(0 0,100% 0,100% calc(100% - 46px),calc(100% - 46px) 100%,0 100%);
     box-shadow:0 0 40px rgba(154,77,255,.25),inset 0 0 60px rgba(0,0,0,.6);}
  .t .hero .img{position:absolute;inset:0;background-size:cover;background-position:center;filter:contrast(1.08) saturate(1.05);}
  .t .hero .rim{position:absolute;inset:0;border:1.5px solid rgba(166,255,46,.35);clip-path:inherit;}
  .t .specs{position:absolute;left:64px;right:64px;top:756px;display:flex;gap:14px;}
  .t .specs div{flex:1;border:1px solid #23283180;background:linear-gradient(180deg,rgba(255,255,255,.04),transparent);padding:14px 16px;}
  .t .specs .k{color:#7f8792;font-size:16px;letter-spacing:2px;font-weight:700;}
  .t .specs .v{color:var(--green);font-family:var(--dsp);font-size:38px;line-height:1;margin-top:6px;}
  .t .body{position:absolute;left:64px;right:64px;top:892px;}
  .t h2{font-family:var(--dsp);font-size:122px;line-height:.84;letter-spacing:-2px;text-transform:uppercase;
     background:linear-gradient(180deg,#ffffff,#b9c2cc);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(166,255,46,.18));}
  .t h2 .u{display:inline-block;color:var(--green);-webkit-text-fill-color:var(--green);border-bottom:6px solid var(--purple);text-shadow:0 0 22px rgba(166,255,46,.5);}
  .t .foot{position:absolute;left:64px;right:64px;bottom:58px;display:flex;align-items:center;justify-content:space-between;color:#8791a0;font-size:21px;font-weight:700;letter-spacing:2px;}
  .t .foot .ar{font-family:var(--dsp);color:var(--green);font-size:30px;letter-spacing:4px;text-shadow:0 0 14px rgba(166,255,46,.5);}

  /* ===== 3 · DROP (Nike / hypebeast) ===== */
  .d{background:#ECEAE4;color:#0B0B0B;}
  .d .num{position:absolute;right:40px;top:24px;font-family:var(--dsp);font-size:340px;line-height:1;color:#0b0b0b;opacity:.06;letter-spacing:-10px;}
  .d .top{position:absolute;left:64px;right:64px;top:56px;display:flex;align-items:center;justify-content:space-between;z-index:3;}
  .d .wm{font-size:30px;font-weight:900;letter-spacing:-.5px;}
  .d .wm b{color:#0b0b0b;background:var(--green);padding:2px 8px;}
  .d .cat{font-family:var(--dsp);font-size:24px;letter-spacing:4px;}
  .d .big{position:absolute;left:52px;top:150px;font-family:var(--dsp);font-size:230px;line-height:.78;letter-spacing:-6px;text-transform:uppercase;z-index:2;}
  .d .hero{position:absolute;left:120px;right:80px;top:470px;height:560px;overflow:hidden;background:#0b0b0b;transform:rotate(-2deg);box-shadow:0 30px 60px rgba(0,0,0,.35);z-index:2;}
  .d .hero .img{position:absolute;inset:0;background-size:cover;background-position:center;filter:grayscale(1) contrast(1.1);}
  .d .hero .tint{position:absolute;inset:0;background:var(--green);mix-blend-mode:multiply;opacity:.86;}
  .d .hero .tint2{position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.35));}
  .d .slab{position:absolute;left:64px;bottom:150px;background:#0b0b0b;color:var(--green);font-family:var(--dsp);font-size:96px;line-height:1;letter-spacing:-1px;padding:8px 22px;z-index:4;transform:rotate(-2deg);}
  .d .foot{position:absolute;left:64px;right:64px;bottom:58px;display:flex;align-items:center;justify-content:space-between;z-index:4;}
  .d .foot .ar{font-family:var(--dsp);font-size:44px;letter-spacing:1px;}
  .d .foot .h{font-size:24px;font-weight:900;letter-spacing:1px;}

  /* ===== 4 · AURA (Apple / minimal luxo) ===== */
  .a{background:radial-gradient(120% 90% at 50% 30%,#191b20 0%,#0a0b0d 62%);color:#fff;text-align:center;}
  .a .wm{position:absolute;left:0;right:0;top:74px;font-size:24px;font-weight:600;letter-spacing:5px;color:#e7eaee;}
  .a .wm b{color:var(--green);}
  .a .kick{position:absolute;left:0;right:0;top:150px;font-size:22px;letter-spacing:9px;color:#8b93a0;font-weight:600;}
  .a .hero{position:absolute;left:140px;right:140px;top:290px;height:520px;}
  .a .hero .img{position:absolute;inset:0;background-size:contain;background-repeat:no-repeat;background-position:center;filter:drop-shadow(0 40px 50px rgba(0,0,0,.65));}
  .a .refl{position:absolute;left:220px;right:220px;top:812px;height:120px;background-size:contain;background-repeat:no-repeat;background-position:center top;transform:scaleY(-1);opacity:.18;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent);}
  .a h2{position:absolute;left:80px;right:80px;top:944px;font-family:var(--dsp);font-size:118px;line-height:.9;letter-spacing:-1px;}
  .a h2 .g{color:var(--green);}
  .a .dek{position:absolute;left:150px;right:150px;top:1122px;font-size:30px;line-height:1.4;color:#9aa2ae;font-weight:300;}
  .a .foot{position:absolute;left:0;right:0;bottom:56px;color:#5f6672;font-size:20px;letter-spacing:4px;}
</style></head><body>
<h1>PromoLiso — 4 referências, 1 de cada</h1>
<div class="sub">Mesma capa (GMKTEC · RTX 5070). Foto tratada por estilo · tipografia/hierarquia afiadas · cor coesa · identidade própria.</div>
<div class="row" id="row"></div>
<script>
const B="https://res.cloudinary.com/fy2n2qvr/image/fetch/", S="https://www.adrenaline.com.br/wp-content/uploads/2026/07/gmktec-neo-x1-pro-pc-compacto-01.jpg";
const fill=(w,h,x="")=>B+`c_fill,g_auto${x},w_${w},h_${h},f_auto,q_auto:good/`+encodeURIComponent(S);
const fit=(w,h)=>B+`c_fit,w_${w},h_${h},f_auto,q_auto:good/`+encodeURIComponent(S);

const P=`<div class="frame p">
  <div class="top"><div class="wm">Promo<b>Liso</b></div><div class="live"><i></i>NOTÍCIA · AGORA</div></div>
  <div class="hero"><div class="img" style="background-image:url('${fill(1080,720,',z_1.15')}')"></div></div>
  <div class="chip">HARDWARE</div>
  <div class="body">
    <h2>GMKtec entra forte no SFF</h2>
    <div class="dek">PC compacto para jogos e tarefas pesadas, com Ryzen 9 9955HX3D e RTX 5070 — desktop-class em 14,6 litros.</div>
  </div>
  <div class="meta"><div><b>@promoliso0</b> · GAMES · HARDWARE</div><div>ARRASTE →</div></div>
</div>`;

const T=`<div class="frame t">
  <div class="grain"></div><div class="glow"></div><div class="slash"></div>
  <div class="top"><div class="wm">Promo<b>Liso</b></div><div class="tab">NOTÍCIA</div></div>
  <div class="hero"><div class="img" style="background-image:url('${fill(1000,640,',z_1.15')}')"></div><div class="rim"></div></div>
  <div class="specs">
    <div><div class="k">GPU</div><div class="v">RTX 5070</div></div>
    <div><div class="k">CPU</div><div class="v">9955HX3D</div></div>
    <div><div class="k">VOLUME</div><div class="v">14,6 L</div></div>
  </div>
  <div class="body"><h2>GMKTEC<br>NEO X1 <span class="u">PRO</span></h2></div>
  <div class="foot"><div>@promoliso0 · POTÊNCIA DESKTOP</div><div class="ar">ARRASTE →</div></div>
</div>`;

const D=`<div class="frame d">
  <div class="num">01</div>
  <div class="top"><div class="wm">Promo<b>Liso</b></div><div class="cat">NOTÍCIA</div></div>
  <div class="big">GMKTEC</div>
  <div class="hero"><div class="img" style="background-image:url('${fill(1000,760,',z_1.2')}')"></div><div class="tint"></div><div class="tint2"></div></div>
  <div class="slab">RTX 5070 · SFF</div>
  <div class="foot"><div class="ar">ARRASTE →</div><div class="h">@PROMOLISO0</div></div>
</div>`;

const A=`<div class="frame a">
  <div class="wm">Promo<b>Liso</b></div>
  <div class="kick">NOTÍCIA</div>
  <div class="hero"><div class="img" style="background-image:url('${fit(1100,780)}')"></div></div>
  <div class="refl" style="background-image:url('${fit(1100,780)}')"></div>
  <h2>GMKtec entra forte<br>no <span class="g">SFF</span></h2>
  <div class="dek">Ryzen 9 9955HX3D e RTX 5070 num corpo de 14,6 litros.</div>
  <div class="foot">@promoliso0 · ARRASTE PARA VER</div>
</div>`;

const items=[
  ["1 · PULSE","IGN / The Verge — portal gamer moderno. Foto full-bleed, borda verde, chip de categoria, headline forte, byline. Limpo e credível.",P],
  ["2 · TITAN","Nvidia / ROG — box-art de hardware. Preto profundo, grain, moldura angular neon, faixa de specs, título metálico com glow. Poder.",T],
  ["3 · DROP","Nike / hypebeast — tipografia gigante, foto duotone verde inclinada, número fantasma, slab preto. Energia de drop/oferta.",D],
  ["4 · AURA","Apple / minimal luxo — fundo escuro, produto isolado com reflexo, tudo centrado, muito respiro. Sofisticação silenciosa.",A],
];
document.getElementById('row').innerHTML=items.map(([t,d,h])=>`<div class="col"><div class="tag">${t}</div><div class="desc">${d}</div><div class="slot">${h}</div></div>`).join('');
</script>
</body></html>
