<!doctype html><html><head><meta charset="utf-8">
<title>PromoLiso — copy antes/depois</title>
<style>
  @font-face{font-family:PLDisplay;src:url('../assets/BarlowCondensed-ExtraBold.ttf') format('truetype');font-weight:800;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#141519;font-family:system-ui,Arial,sans-serif;padding:32px 18px 80px;}
  h1{color:#fff;font-size:20px;text-align:center;}
  .sub{color:#8b93a0;text-align:center;font-size:13px;margin:6px 0 26px;}
  .band{color:#fff;font-weight:800;letter-spacing:3px;font-size:15px;text-align:center;margin:26px 0 14px;padding:8px;border-radius:6px;}
  .band.b{background:#3a2020;color:#ff9d9d;} .band.a{background:#1e3320;color:#9BFF25;}
  .row{display:flex;gap:34px;flex-wrap:wrap;justify-content:center;align-items:flex-start;}
  .col{display:flex;flex-direction:column;align-items:center;}
  .tag{color:var(--mut);font-weight:700;letter-spacing:2px;font-size:12px;margin-bottom:8px;}
  .slot{--s:.34;width:calc(1080px*var(--s));height:calc(1350px*var(--s));overflow:hidden;box-shadow:0 20px 54px rgba(0,0,0,.6);}
  .frame{transform-origin:top left;transform:scale(var(--s));width:1080px;height:1350px;position:relative;overflow:hidden;display:block;background:#05060A;color:#fff;}
  @media(max-width:1100px){.slot{--s:.28;}}
  :root{--dsp:PLDisplay,'Barlow Condensed',Impact,sans-serif;--green:#A6FF2E;--purple:#9A4DFF;--mut:#8791a0;--body:#c3cbd5;}
  .grain{position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0);background-size:24px 24px;opacity:.5;}
  .glow{position:absolute;inset:0;background:radial-gradient(52% 38% at 80% 2%,rgba(154,77,255,.30),transparent 60%),radial-gradient(58% 40% at 8% 100%,rgba(166,255,46,.12),transparent 60%);}
  .slash{position:absolute;left:0;top:0;width:100%;height:8px;background:linear-gradient(90deg,var(--green),var(--purple));box-shadow:0 0 22px rgba(154,77,255,.7);}
  .hd{position:absolute;left:64px;right:64px;top:50px;display:flex;align-items:center;justify-content:space-between;z-index:3;}
  .wm{font-size:30px;font-weight:800;letter-spacing:3px;} .wm b{color:var(--green);text-shadow:0 0 16px rgba(166,255,46,.7);}
  .tab{font-family:var(--dsp);font-size:22px;letter-spacing:5px;color:#cbd2da;border:1px solid #2b303a;padding:8px 16px;}
  .tab.pg{color:var(--mut);letter-spacing:3px;} .tab.pg b{color:#fff;}
  .hero{position:absolute;left:64px;right:64px;background:#0a0c12;overflow:hidden;clip-path:polygon(0 0,100% 0,100% calc(100% - 46px),calc(100% - 46px) 100%,0 100%);box-shadow:0 0 40px rgba(154,77,255,.22),inset 0 0 60px rgba(0,0,0,.55);}
  .hero .cover{position:absolute;inset:0;background-size:cover;background-position:center;filter:contrast(1.05) saturate(1.04);}
  .hero .rim{position:absolute;inset:0;border:1.5px solid rgba(166,255,46,.34);clip-path:inherit;}
  .hero .cap{position:absolute;left:0;bottom:0;background:rgba(5,6,10,.8);color:#c9cfd7;font-size:15px;font-weight:700;letter-spacing:2px;padding:8px 14px;}
  .kick{display:inline-flex;align-items:center;gap:12px;background:var(--purple);color:#fff;font-family:var(--dsp);font-size:22px;letter-spacing:4px;padding:9px 18px;}
  .kick.line{background:none;color:var(--green);padding:0;} .kick.line:before{content:"";width:34px;height:3px;background:var(--green);}
  h2{font-family:var(--dsp);line-height:.86;letter-spacing:-2px;text-transform:uppercase;background:linear-gradient(180deg,#ffffff,#b9c2cc);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(166,255,46,.16));}
  h2 .u{display:inline-block;color:var(--green);-webkit-text-fill-color:var(--green);border-bottom:6px solid var(--purple);text-shadow:0 0 22px rgba(166,255,46,.5);}
  .strip{display:inline-flex;align-items:center;gap:14px;border:1px solid rgba(166,255,46,.5);background:linear-gradient(180deg,rgba(166,255,46,.06),transparent);color:#eaffd0;font-family:var(--dsp);letter-spacing:-.5px;padding:12px 20px;box-shadow:inset 0 0 24px rgba(166,255,46,.08);}
  .strip:before{content:"";width:14px;height:14px;background:var(--green);box-shadow:0 0 14px rgba(166,255,46,.8);flex:0 0 auto;}
  .dek{color:var(--body);}
  .foot{position:absolute;left:64px;right:64px;bottom:56px;display:flex;align-items:center;justify-content:space-between;z-index:3;color:var(--mut);font-size:21px;font-weight:700;letter-spacing:2px;border-top:1px solid #1b1f27;padding-top:20px;}
  .foot .ar{font-family:var(--dsp);color:var(--green);font-size:30px;letter-spacing:4px;text-shadow:0 0 14px rgba(166,255,46,.5);}
</style></head><body>
<h1>PromoLiso — copy antes/depois (mesmo TITAN, mesma foto)</h1>
<div class="sub">Silent Hill: Townfall · fatos ancorados no PlayStation Blog (data 24/09, Escócia, combate 1ª pessoa, Screen Burn). Nada inventado.</div>
<div id="app"></div>
<script>
const B="https://res.cloudinary.com/fy2n2qvr/image/fetch/";
const cov=(u,w,h,z=1.05)=>B+`c_fill,g_auto,z_${z},w_${w},h_${h},f_auto,q_auto:good/`+encodeURIComponent(u);
const IMGc="https://live.staticflickr.com/65535/55426789530_e1f92a0f12_k.jpg"; // capa
const IMGi="https://live.staticflickr.com/65535/55425420952_1dc270924d_k.jpg"; // impacto

const chrome=`<div class="grain"></div><div class="glow"></div><div class="slash"></div>`;
const wm=`<div class="wm">Promo<b>Liso</b></div>`;
function titleHTML(t){const c=String(t).replace(/[.]+$/,"");const w=c.split(" ");const last=w.pop();return (w.join(" ")+(w.length?" ":"")+`<span class="u">${last}</span>`).toUpperCase();}

function capa(s){return `<div class="frame">${chrome}<div class="hd">${wm}<div class="tab">NOTÍCIA</div></div>
  <div class="hero" style="top:130px;height:600px;"><div class="cover" style="background-image:url('${cov(IMGc,1080,900)}')"></div><div class="rim"></div><div class="cap">FOTO · PLAYSTATION BLOG</div></div>
  <div style="position:absolute;left:64px;right:64px;top:772px;">
    <div class="kick line">${s.selo}</div>
    <h2 style="font-size:${s.ts||104}px;margin-top:20px;">${titleHTML(s.titulo)}</h2>
    <div style="margin-top:24px;"><span class="strip" style="font-size:${s.ds||50}px;">${s.destaque.toUpperCase()}</span></div>
    <div class="dek" style="font-size:29px;line-height:1.36;margin-top:24px;max-width:920px;">${s.texto}</div>
  </div>
  <div class="foot"><div>@promoliso0 · GAMES</div><div class="ar">ARRASTE →</div></div></div>`;}

function slide(s){const duo=true;return `<div class="frame">${chrome}<div class="hd">${wm}<div class="tab pg"><b>04</b> / 06</div></div>
  <div class="hero" style="top:130px;height:452px;"><div class="cover" style="background-image:url('${cov(IMGi,1000,660)}');filter:grayscale(1) contrast(1.1);"></div><div style="position:absolute;inset:0;background:var(--green);mix-blend-mode:multiply;opacity:.34;"></div><div style="position:absolute;inset:0;background:radial-gradient(circle at 80% 15%,rgba(154,77,255,.55),transparent 55%);mix-blend-mode:screen;opacity:.5;"></div><div class="rim"></div><div class="cap">FOTO · PLAYSTATION BLOG</div></div>
  <div style="position:absolute;left:64px;right:64px;top:626px;">
    <div class="kick">${s.selo}</div>
    <h2 style="font-size:${s.ts||84}px;margin-top:20px;">${titleHTML(s.titulo)}</h2>
    <div style="margin-top:18px;"><span class="strip" style="font-size:${s.ds||44}px;">${s.destaque.toUpperCase()}</span></div>
    <div class="dek" style="font-size:31px;line-height:1.4;margin-top:22px;">${s.texto}</div>
  </div>
  <div class="foot"><div>@promoliso0 · SILENT HILL</div><div class="ar">ARRASTE →</div></div></div>`;}

// ---- OLD (real exec103) ----
const oldCapa={selo:"BREAK NEWS",titulo:"Silent Hill: Townfall",destaque:"Sai em 24 de setembro",texto:"Novo capítulo da série chega ao PS5 com foco em terror psicológico e proposta inédita para a franquia."};
const oldImp={selo:"POR QUE IMPORTA",titulo:"É um novo rumo",destaque:"Mais foco em tensão",texto:"Para quem acompanha a franquia, o jogo chama atenção por ampliar a fórmula de Silent Hill com uma abordagem inédita."};
// ---- NEW (rich, grounded) ----
const newCapa={selo:"BREAK NEWS",titulo:"Silent Hill: Townfall tem data",ts:82,destaque:"24 de setembro, no PS5",ds:44,texto:"A Konami confirmou no PlayStation Blog o lançamento de Townfall, um novo capítulo de survival horror. A aposta: terror psicológico com direção inédita, tocada pela Screen Burn Interactive."};
const newImp={selo:"POR QUE IMPORTA",titulo:"Combate agora é em 1ª pessoa",ts:66,destaque:"A maior virada da série",ds:40,texto:"Townfall abandona a câmera tradicional e adota combate em primeira pessoa — mudança grande pra franquia. Pode dividir os puristas, mas mostra que a Konami quer reinventar Silent Hill, não só repetir a fórmula."};

document.getElementById('app').innerHTML=
  `<div class="band b">ANTES · como sai hoje (texto ≤190, título ≤34)</div>
   <div class="row">
     <div class="col"><div class="tag">CAPA</div><div class="slot">${capa(oldCapa)}</div></div>
     <div class="col"><div class="tag">IMPACTO</div><div class="slot">${slide(oldImp)}</div></div>
   </div>
   <div class="band a">DEPOIS · copy enriquecido (texto ~300, dado concreto por slide)</div>
   <div class="row">
     <div class="col"><div class="tag">CAPA</div><div class="slot">${capa(newCapa)}</div></div>
     <div class="col"><div class="tag">IMPACTO</div><div class="slot">${slide(newImp)}</div></div>
   </div>`;
</script>
</body></html>
